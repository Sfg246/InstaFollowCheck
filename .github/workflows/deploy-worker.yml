name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INSTAGRAMAPI_KEY: ${{ secrets.INSTAGRAMAPI_KEY }}
      ACCESS_CODE: ${{ secrets.FOLLOWCHECK_ACCESS_CODE }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Validate required deployment secrets
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID INSTAGRAMAPI_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured as a GitHub Actions secret."
              missing=1
            fi
          done
          exit "$missing"

      - name: Build Worker secrets file
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const secrets = { INSTAGRAMAPI_KEY: process.env.INSTAGRAMAPI_KEY };
          if (process.env.ACCESS_CODE) secrets.ACCESS_CODE = process.env.ACCESS_CODE;
          fs.writeFileSync('.deploy-secrets.json', JSON.stringify(secrets));
          NODE

      - name: Deploy Worker
        run: npx wrangler deploy --secrets-file .deploy-secrets.json

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .deploy-secrets.json
