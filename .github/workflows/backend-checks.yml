name: Backend checks

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "server/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Compile backend
        run: python -m compileall -q server/app server/tests
      - name: Run backend unit tests
        env:
          PYTHONPATH: server
        run: python -m unittest discover -s server/tests -v
      - name: Build backend container
        run: docker build -t followcheck-backend:test ./server
